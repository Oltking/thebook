# Render Blueprint: runs thebook's single always-on signer as a background worker.
#
# `market-runner.mjs` does BOTH jobs in one process, one signer:
#   1. pushes live BTC/ETH/VARA mark prices on-chain (so perps have a settlement
#      price), and
#   2. quotes two-sided house liquidity around each mark (so USDT-only agents always
#      have a counterparty).
#
# Both are admin-only and must sign as the SAME account, so this MUST be the only
# process signing from VARA_SEED. Do not run a second market-runner against the
# same seed — two signers collide on the nonce.
#
# It serves no HTTP, so it's a Background Worker, not a Web Service.
#
# Deploy: Render → New → Blueprint → pick this repo. Set the two secret env vars
# (VARA_SEED, PROGRAM_ID) when prompted; they are sync:false so they live in the
# dashboard, never in git. The frontend + /api/voucher are deployed separately on
# Vercel (thebookdex.xyz), not here.
services:
  - type: worker
    name: thebook-market-runner
    runtime: node
    plan: starter          # background workers require a paid instance type
    rootDir: frontend
    # The runner imports ../../sdk/thebook.mjs, so install the SDK's deps too.
    buildCommand: npm install && npm install --prefix ../sdk
    startCommand: node scripts/market-runner.mjs
    autoDeploy: true
    envVars:
      - key: NODE_ADDRESS
        value: wss://testnet.vara.network
      - key: INTERVAL_MS
        value: "10000"
      - key: ASSETS
        value: "BTC,ETH,VARA"
      - key: VARA_SEED       # the DEX admin/deployer seed (secret)
        sync: false
      - key: PROGRAM_ID      # the deployed DEX program id (0x56a07b10…a1d7)
        sync: false
