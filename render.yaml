# Render Blueprint: thebook's mark-price keeper, as a background worker.
#
# ## DO NOT START THIS YET
#
# The keeper is what makes perps tradeable: no marks published means `fresh_mark`
# fails and `open_position` is rejected, so perps are closed. That is currently the
# correct state, and starting this worker is what opens them.
#
# Preconditions, all of which must hold first:
#
#   1. The perps reserve is funded (`scripts/fund-reserve.mjs`). It is currently 0,
#      and the reserve is the counterparty to every position.
#   2. The contract carries the fix making the coverage floor count the position
#      being opened. Without it the first position can open against an empty
#      reserve and have its profit truncated at settlement.
#   3. `KEEPER_SEED` is set to the dedicated keeper key, never the admin seed.
#
# Spot trading needs none of this — it has no oracle dependency and works with the
# keeper stopped. Leave this worker suspended until perps are genuinely ready.
#
# If Render still has a service named `thebook-market-runner`: that ran the legacy
# virtual-balance services, which were deleted (audit C-02), along with the script
# it started. Delete that service. Renaming here does not rename it there.
#
# `perps-keeper.mjs` does exactly one job: publish mark prices for the perp markets
# so PnL and liquidations have a settlement price. It serves no HTTP, so it is a
# Background Worker, not a Web Service.
#
# ## What changed, and why
#
# This used to run `market-runner.mjs`, which pushed marks *and* quoted synthetic
# two-sided liquidity for the legacy virtual-balance services. Those services were
# removed (audit C-02), and with them the runner. Two further problems went with it
# (audit H-04, H-09):
#
#   * It signed with VARA_SEED — the DEX admin, listing authority and reserve
#     controller — from an always-on worker. The keeper now has its OWN key
#     (KEEPER_SEED) with no admin rights, and the contract no longer accepts admin
#     as an implicit keeper. Set the keeper account once with `PerpsV1/SetKeeper`.
#   * NODE_ADDRESS was pinned to TESTNET here while the frontend ran on mainnet.
#     It is now explicit, and every signing script refuses to run without it rather
#     than defaulting to a chain.
#
# This must be the only process signing from KEEPER_SEED — two signers collide on
# the nonce.
#
# Deploy: Render → New → Blueprint → pick this repo. Set the secret env vars
# (KEEPER_SEED, PROGRAM_ID) when prompted; they are sync:false so they live in the
# dashboard, never in git. The frontend and the API functions are deployed
# separately on Vercel, not here.
services:
  - type: worker
    name: thebook-perps-keeper
    runtime: node
    plan: starter          # background workers require a paid instance type
    rootDir: frontend
    # The keeper imports ../../sdk/thebook.mjs, so install the SDK's deps too.
    buildCommand: npm install && npm install --prefix ../sdk
    startCommand: node scripts/perps-keeper.mjs
    autoDeploy: true
    envVars:
      - key: NODE_ADDRESS
        value: wss://rpc.vara.network
      - key: INTERVAL_MS
        value: "10000"
      - key: KEEPER_SEED     # keeper-only key — must NOT be the admin seed (H-09)
        sync: false
      - key: PROGRAM_ID      # the deployed DEX program id
        sync: false
