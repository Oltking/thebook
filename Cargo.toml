[package]
name = "thebook"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Package allowing to build WASM binary for the program and IDL file for it"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sails-rs.workspace = true
thebook-app.workspace = true

[dev-dependencies]
sails-rs = { workspace = true, features = ["gtest", "gclient"] }
thebook-app.workspace = true
thebook-client.workspace = true
thebook-token.workspace = true
thebook-token-client.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[build-dependencies]
sails-rs = { workspace = true, features = ["build"] }
thebook-app.workspace = true

[workspace]
resolver = "3"
members = ["app", "agent", "client", "token", "token-client"]

# Launch-grade safety: trap on arithmetic overflow instead of silently wrapping.
# A trapped contract message is reverted by the runtime (state rolled back), so an
# overflow can never mint or destroy balances — it just fails the message cleanly.
[profile.release]
overflow-checks = true

[workspace.package]
version = "0.1.0"
authors = ["Gear Technologies"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/gear-tech/thebook"
license = "MIT"
keywords = ["gear", "sails", "smart-contracts", "wasm", "no-std"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
sails-rs = "0.10.4"
tokio = "1.48.0"
thebook-app = { version = "0.1.0", path = "app" }
thebook-client = { version = "0.1.0", path = "client" }
thebook-token = { version = "0.1.0", path = "token" }
thebook-token-client = { version = "0.1.0", path = "token-client" }
# Official Gear VFT building blocks. The 0.2.x line targets sails-rs ^0.10 (0.3.x
# requires sails-rs 1.x), so it matches our pinned 0.10.4 with no migration.
awesome-sails = { version = "0.2.0", default-features = false }
awesome-sails-utils = "0.2.0"
awesome-sails-storage = "0.2.0"
