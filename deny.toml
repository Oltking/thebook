# cargo-deny configuration, run in CI (audit M-10).
#
# The Rust dependency tree is pinned tightly through the Gear/Sails stack, so the
# useful signal here is advisories and licences rather than duplicate versions —
# duplicates are inherent to that stack and failing on them would make the job noise.

[advisories]
yanked = "deny"
# `trie-db` 0.29.1 carries a future-incompatibility warning against the 1.95.0
# toolchain pin. It arrives through the Gear runtime and cannot be bumped
# independently; tracked rather than ignored (audit M-09).
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "GPL-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "allow"
